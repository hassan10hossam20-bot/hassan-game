<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة حسن 🎮</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <div class="background-name">حسن</div>

        <h1>🎮 لعبة حسن</h1>

        <div class="score">
            النقاط: <span id="score">0</span>
        </div>

        <div id="player">😎</div>

        <div id="enemy">💀</div>

        <div id="gameOver">
            <h2>انتهت اللعبة 💀</h2>

            <p>
                نقاطك:
                <span id="finalScore">0</span>
            </p>

            <button onclick="restartGame()">
                العب تاني 🔥
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
